<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BJD 脸片&发型匹配库</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🎭 BJD 脸片 & 前后发匹配库</h1>
            <p>记录你的BJD配件匹配情况，方便搭配管理</p>
        </header>

        <!-- 数据操作区 -->
        <div class="data-ops">
            <button onclick="exportData()" class="btn btn-export">💾 导出数据</button>
            <label class="btn btn-import">
                📁 导入数据
                <input type="file" id="importFile" accept=".json" onchange="importData(this)" hidden>
            </label>
            <button onclick="clearAll()" class="btn btn-danger">🗑️ 清空所有</button>
            <span id="dataStatus">当前数据: 本地存储</span>
        </div>

        <!-- 标签页切换 -->
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('faces')">脸片管理</button>
            <button class="tab-btn" onclick="switchTab('hairs')">前后发管理</button>
            <button class="tab-btn" onclick="switchTab('matches')">匹配关系</button>
            <button class="tab-btn" onclick="switchTab('search')">🔍 匹配查询</button>
        </div>

        <!-- 脸片管理 -->
        <div id="tab-faces" class="tab-content active">
            <h2>脸片库</h2>
            <div class="form-section">
                <h3>添加脸片</h3>
                <div class="form-grid">
                    <input type="text" id="faceName" placeholder="脸片名称 (如: 开眼脸-温柔)" required>
                    <input type="text" id="faceBrand" placeholder="品牌/系列 (如: Volks-DD)">
                    <input type="number" id="faceHeadSize" placeholder="头围/cm (如: 22.5)" step="0.1">
                    <input type="text" id="faceEyeSize" placeholder="眼珠尺寸/mm (如: 20/22)">
                    <input type="text" id="faceNote" placeholder="备注 (肤色、年份等)">
                    <button onclick="addFace()" class="btn btn-primary">添加脸片</button>
                </div>
            </div>
            <div class="list-section" id="faceList"></div>
        </div>

        <!-- 前后发管理 -->
        <div id="tab-hairs" class="tab-content">
            <h2>前后发库</h2>
            <div class="form-section">
                <h3>添加前后发</h3>
                <div class="form-grid">
                    <input type="text" id="hairName" placeholder="前后发名称 (如: 波浪卷-黑)" required>
                    <input type="text" id="hairBrand" placeholder="品牌/系列">
                    <select id="hairType">
                        <option value="front">前发</option>
                        <option value="back">后发</option>
                        <option value="set">前后发套装</option>
                        <option value="wig">全头假发</option>
                    </select>
                    <input type="text" id="hairColor" placeholder="颜色">
                    <input type="text" id="hairNote" placeholder="备注">
                    <button onclick="addHair()" class="btn btn-primary">添加发型</button>
                </div>
            </div>
            <div class="list-section" id="hairList"></div>
        </div>

        <!-- 匹配关系 -->
        <div id="tab-matches" class="tab-content">
            <h2>匹配记录</h2>
            <div class="form-section">
                <h3>记录匹配关系</h3>
                <div class="form-grid match-form">
                    <select id="matchFace" onchange="updateMatchPreview()">
                        <option value="">选择脸片...</option>
                    </select>
                    <select id="matchHair" onchange="updateMatchPreview()">
                        <option value="">选择发型...</option>
                    </select>
                    <select id="matchResult">
                        <option value="perfect">✅ 完美匹配</option>
                        <option value="good">🟡 可以匹配（需调整）</option>
                        <option value="tight">🔴 偏紧</option>
                        <option value="loose">🔵 偏松</option>
                        <option value="no">❌ 无法匹配</option>
                    </select>
                    <input type="text" id="matchDetail" placeholder="具体情况 (如: 需要眼泥固定/鬓角需修剪)">
                    <button onclick="addMatch()" class="btn btn-primary">记录匹配</button>
                </div>
                <div id="matchPreview" class="match-preview"></div>
            </div>
            <div class="list-section" id="matchList"></div>
        </div>

        <!-- 匹配查询 -->
        <div id="tab-search" class="tab-content">
            <h2>🔍 智能匹配查询</h2>
            <div class="search-box">
                <select id="searchType" onchange="updateSearch()">
                    <option value="byFace">按脸片查可配发型</option>
                    <option value="byHair">按发型查可配脸片</option>
                </select>
                <select id="searchTarget">
                    <option value="">请选择...</option>
                </select>
                <label><input type="checkbox" id="showBad" checked> 显示不匹配记录（避免踩雷）</label>
            </div>
            <div id="searchResult" class="search-result"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
