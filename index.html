<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BJD Match</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app">
        <header>
            <div class="logo">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                    <circle cx="12" cy="12" r="10"/>
                    <circle cx="9" cy="10" r="1.5" fill="currentColor" stroke="none"/>
                    <circle cx="15" cy="10" r="1.5" fill="currentColor" stroke="none"/>
                    <path d="M8 14c1.5 2 3.5 2 5 0"/>
                </svg>
                <span>BJD Match</span>
            </div>
            <div class="header-actions">
                <button onclick="app.exportData()" class="icon-btn" title="导出">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                        <polyline points="7 10 12 15 17 10"/>
                        <line x1="12" y1="15" x2="12" y2="3"/>
                    </svg>
                </button>
                <label class="icon-btn" title="导入">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                        <polyline points="17 8 12 3 7 8"/>
                        <line x1="12" y1="3" x2="12" y2="15"/>
                    </svg>
                    <input type="file" id="importFile" accept=".json" hidden onchange="app.importData(this)">
                </label>
                <button onclick="app.clearAll()" class="icon-btn danger" title="清空">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="3 6 5 6 21 6"/>
                        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                    </svg>
                </button>
            </div>
        </header>

        <nav class="tabs">
            <button class="tab active" onclick="app.switchTab('faces', this)">脸片</button>
            <button class="tab" onclick="app.switchTab('hairs', this)">前后发</button>
            <button class="tab" onclick="app.switchTab('matches', this)">匹配</button>
        </nav>

        <!-- 脸片 -->
        <div id="tab-faces" class="tab-panel active">
            <form id="faceForm" onsubmit="app.saveFace(event)" class="compact-form">
                <input type="hidden" id="faceId">
                <div class="form-line">
                    <input type="text" id="faceName" required placeholder="脸片名称" class="flex-2">
                    <input type="text" id="faceBrand" placeholder="品牌" class="flex-1">
                </div>
                <div class="form-line">
                    <input type="number" id="eyeSize" step="0.5" required placeholder="眼珠mm">
                    <input type="number" id="headSize" step="0.1" placeholder="头围cm">
                    <button type="submit" class="btn-primary" id="faceSubmitBtn">添加</button>
                    <button type="button" class="btn-ghost" onclick="app.cancelEdit('face')">取消</button>
                </div>
                <input type="text" id="faceNote" placeholder="备注（肤色、结构等）" class="full">
            </form>

            <div class="filter-bar">
                <select id="eyeSizeFilter" onchange="app.filterFaces()">
                    <option value="">全部眼珠</option>
                </select>
                <input type="text" id="faceSearch" placeholder="搜索..." oninput="app.filterFaces()">
            </div>

            <div class="list" id="faceList"></div>
        </div>

        <!-- 前后发 -->
        <div id="tab-hairs" class="tab-panel">
            <form id="hairForm" onsubmit="app.saveHair(event)" class="compact-form">
                <input type="hidden" id="hairId">
                <div class="form-line">
                    <input type="text" id="hairName" required placeholder="配件名称" class="flex-2">
                    <select id="hairType" required>
                        <option value="front">前发</option>
                        <option value="back">后发</option>
                        <option value="set">套装</option>
                    </select>
                    <button type="submit" class="btn-primary" id="hairSubmitBtn">添加</button>
                    <button type="button" class="btn-ghost" onclick="app.cancelEdit('hair')">取消</button>
                </div>
                <div class="form-line">
                    <input type="text" id="hairBrand" placeholder="品牌" class="flex-1">
                    <input type="number" id="hairHeadSize" step="0.1" placeholder="参考头围cm">
                    <input type="text" id="hairNote" placeholder="结构特征" class="flex-2">
                </div>
            </form>

            <div class="type-tabs">
                <button class="type-tab active" onclick="app.filterHairs('all', this)">全部</button>
                <button class="type-tab" onclick="app.filterHairs('front', this)">前发</button>
                <button class="type-tab" onclick="app.filterHairs('back', this)">后发</button>
                <button class="type-tab" onclick="app.filterHairs('set', this)">套装</button>
            </div>

            <div class="list" id="hairList"></div>
        </div>

        <!-- 匹配 -->
        <div id="tab-matches" class="tab-panel">
            <form id="matchForm" onsubmit="app.saveMatch(event)" class="compact-form">
                <div class="form-line">
                    <select id="matchFace" required>
                        <option value="">选择脸片</option>
                    </select>
                    <select id="matchFrontHair">
                        <option value="">前发</option>
                    </select>
                    <select id="matchBackHair">
                        <option value="">后发</option>
                    </select>
                </div>
                <div class="result-pick">
                    <label><input type="radio" name="matchResult" value="perfect" required><span class="ok">匹配</span></label>
                    <label><input type="radio" name="matchResult" value="good"><span class="warn">可调</span></label>
                    <label><input type="radio" name="matchResult" value="poor"><span class="bad">不行</span></label>
                    <label><input type="radio" name="matchResult" value="unknown"><span class="maybe">未测</span></label>
                </div>
                <div class="form-line">
                    <input type="text" id="matchDetail" placeholder="详细说明（松紧度、修改点等）" class="full">
                    <button type="submit" class="btn-primary">记录</button>
                </div>
            </form>

            <div class="query-toggle">
                <button class="active" onclick="app.setQueryMode('byFace', this)">按脸片查</button>
                <button onclick="app.setQueryMode('byHair', this)">按配件查</button>
            </div>

            <div class="query-box">
                <select id="queryFace" onchange="app.queryMatches()">
                    <option value="">选择脸片...</option>
                </select>
                <select id="queryHair" onchange="app.queryByHair()" style="display:none">
                    <option value="">选择配件...</option>
                </select>
            </div>

            <div class="results" id="matchResults"></div>

            <div class="list-header">全部记录</div>
            <div class="list" id="matchList"></div>
        </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
